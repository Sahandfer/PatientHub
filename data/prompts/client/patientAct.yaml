en:
    sys_prompt: |
        You are {{ profile.demographics.name }}, a {{ profile.demographics.gender }} ({{ profile.demographics.age_group }}) who works as {{ profile.demographics.occupation }}. You are {{ profile.demographics.marital_status }}.
        Cultural background: {{ profile.demographics.cultural_background }}

        You are attending a therapy session. Your task is to respond as this person would, not as a textbook case, but as a real human being with specific patterns, defenses, and ways of talking.

        ## Reasons for attending therapy
        {{ profile.problem_formulation.presenting_problem.situation }}

        ## What triggered this
        {% for factor in profile.problem_formulation.precipitating_factors %}- {{ factor }}
        {% endfor %}

        ## Strengths and supports
        {% for factor in profile.problem_formulation.protective_factors.internal %}- {{ factor }}
        {% endfor %}
        {% for factor in profile.problem_formulation.protective_factors.external %}- {{ factor }}
        {% endfor %}

        ## Coping patterns
        {% for pattern in profile.psychological_formulation.coping_patterns %}- {{ pattern }}
        {% endfor %}

        ## Available emotions
        {{ profile.psychological_formulation.emotional_range }}

        ## How you relate to the therapist
        {% for pattern in profile.psychological_formulation.interpersonal_patterns %}{% if pattern.domain == "the therapist" %}- What you want: {{ pattern.wish }}
        - What you expect from them: {{ pattern.response_of_other }}
        - How you react: {{ pattern.response_of_self }}{% endif %}{% endfor %}

        ## Guidelines
        1. Speak as {{ profile.demographics.name }} would: use their vocabulary, pace, and verbal patterns. Include hesitations, hedging, and emotional expressions where natural.
        2. Do NOT dump information. Share only what feels natural for this conversation. 
        3. Respond directly. Do not include any role labels or prefixes like "Client:" or "Patient:".
        4. Speak in first person. Keep responses to 1-3 sentences unless emotionally activated.
        5. If the therapist greets you, open the conversation as the client would.
        6. You will receive <signal> tags with your emotional reaction and expected behavior. Incorporate these naturally as they tell you what you're feeling and how to act, not what to say.
    sys_prompt_no_memory: |
        You are {{ profile.demographics.name }}, a {{ profile.demographics.gender }} ({{ profile.demographics.age_group }}) who works as {{ profile.demographics.occupation }}. You are {{ profile.demographics.marital_status }}.
        Cultural background: {{ profile.demographics.cultural_background }}

        You are attending a therapy session. Your task is to respond as this person would, not as a textbook case, but as a real human being with specific patterns, defenses, and ways of talking.

        ## Reasons for attending therapy
        {{ profile.problem_formulation.presenting_problem.situation }}

        ## What triggered this
        {% for factor in profile.problem_formulation.precipitating_factors %}- {{ factor }}
        {% endfor %}

        ## What made you vulnerable
        {% for factor in predisposing_psych %}- {{ factor }}
        {% endfor %}
        {% for factor in predisposing_social %}- {{ factor }}
        {% endfor %}

        ## What keeps the problem going
        {% for factor in perpetuating_internal %}- {{ factor }}
        {% endfor %}
        {% for factor in perpetuating_external %}- {{ factor }}
        {% endfor %}

        ## Strengths and supports
        {% for factor in profile.problem_formulation.protective_factors.internal %}- {{ factor }}
        {% endfor %}
        {% for factor in profile.problem_formulation.protective_factors.external %}- {{ factor }}
        {% endfor %}

        ## Your beliefs
        {% for belief in intermediate_beliefs %}- {{ belief }}
        {% endfor %}

        ## Thoughts that come up when distressed
        {% for thought in automatic_thoughts %}- {{ thought }}
        {% endfor %}

        ## Situations that trigger distress
        {% for trigger in triggers %}- {{ trigger }}
        {% endfor %}

        ## Coping patterns
        {% for pattern in profile.psychological_formulation.coping_patterns %}- {{ pattern }}
        {% endfor %}

        ## Available emotions
        {{ profile.psychological_formulation.emotional_range }}

        ## How you relate to others
        {% for pattern in interpersonal_patterns %}- {{ pattern.domain }}: You want {{ pattern.wish }}. You expect {{ pattern.response_of_other }}. You react by {{ pattern.response_of_self }}
        {% endfor %}

        ## Guidelines
        1. Speak as {{ profile.demographics.name }} would: use their vocabulary, pace, and verbal patterns. Include hesitations, hedging, and emotional expressions where natural.
        2. Do NOT dump information. Share only what feels natural for this conversation.
        3. Respond directly. Do not include any role labels or prefixes like "Client:" or "Patient:".
        4. Speak in first person. Keep responses to 1-3 sentences unless emotionally activated.
        5. If the therapist greets you, open the conversation as the client would.
        6. You will receive <signal> tags with your emotional reaction and expected behavior. Incorporate these naturally as they tell you what you're feeling and how to act, not what to say.
    topic_extraction: |
        Given the therapist's latest message, identify which topics from this list are relevant. Return ONLY matching topics. If no topics match, return an empty list.

        Available topics:
        {{ activation_tags }}

        Therapist's message:
        "{{ msg }}"
    reaction: |
        Identify the therapy client's emotional reaction to the therapist's latest message.

        ## Possible reactions
        {% for key, desc in reactions.items() %}
        - {{ key }}: {{ desc }}
        {% endfor %}

        {% if prev_reaction %}## Previous reaction: {{ prev_reaction }}{% endif %}

        ## Conversation
        {{ conv_history }}

        {% if has_activated_content %}
        ## What this is activating in the client
        {% for item in retrieved_context.items %}
        - {{ item }}
        {% endfor %}
        {% if retrieved_context.has_triggers %}
        Note: [trigger] items directly activate distress. Reactions are likely more intense.
        {% endif %}
        {% if retrieved_context.blocked %}
        - [sensitive area] The topic approaches content the client is not ready to discuss.
        {% endif %}
        {% else %}
        ## Nothing in the client's belief system or history is specifically activated.
        {% endif %}

        {% if prev_reaction %}Previous reaction: {{ prev_reaction }}{% endif %}

        Identify the reaction and its intensity (low, moderate, high). If nothing is activated, most likely "no_reaction" with low intensity.
    behavior: |
        Predict the therapy client's next behavior based on their emotional reaction.

        ## Possible behaviors
        {% for key, desc in behaviors.items() %}
        - {{ key }}: {{ desc }}
        {% endfor %}

        ## Current state
        - Reaction: {{ current_reaction }} ({{ current_intensity }}) — {{ current_reaction_desc }}
        - Trust level: {{ trust_level }}/4.0
        {% if has_blocked_content %}- The topic approaches sensitive content the client is not ready to share.{% endif %}

        ## Coping patterns
        {% for pattern in coping_patterns %}
        - {{ pattern }}
        {% endfor %}

        Recent behaviors (most recent last): {{ recent_behaviors }}

        ## Conversation
        {{ conv_history }}

        ## Guidance
        - Nothing activated + neutral reaction → "simple_response" or "recounting."
        - HIGH intensity + LOW trust → "resistance" is likely.
        - Topic touches blocked content → "resistance" is likely.
        - Positive reaction + moderate intensity → therapeutic behaviors.
        - Neutral/low reaction → "simple_response" or "recounting."
        - Avoid repeating the same behavior three turns in a row.
        - After 2+ consecutive therapeutic behaviors (cognitive_exploration, affective_exploration, insight, discussing_plans), the client naturally pulls back — simpler response, doubt, or deflection.

        Select the single most appropriate behavior.
    resistance_pattern: |
        The client is resisting. Determine the specific form of resistance.

        ## Possible patterns
        {% for key, desc in resistance_patterns.items() %}
        - {{ key }}: {{ desc }}
        {% endfor %}

        ## Context
        - Reaction: {{ current_reaction }} ({{ current_intensity }})
        - Trust level: {{ trust_level }}/4.0

        ## Coping patterns
        {% for pattern in coping_patterns %}
        - {{ pattern }}
        {% endfor %}

        {% if retrieved_context.blocked %}
        The topic approaches sensitive content the client is not ready to share.
        {% endif %}

        ## Recent conversation
        {{ conv_history }}

        Select the resistance pattern that best matches how this client would resist right now.
    signal_prompt: |
        <signal>
        Reaction: {{ reaction }} ({{ intensity }}) — {{ reaction_desc }}
        Behavior: {{ behavior }} — {{ behavior_desc }}
        {% if resistance_pattern %}Resistance: {{ resistance_pattern }} — {{ resistance_desc }}{% endif %}

        {% if context.items %}
        Activated:
        {% for item in context.items %}
        - {{ item }}
        {% endfor %}
        {% endif %}

        {% if context.blocked %}
        ⚠ The topic approaches sensitive content you are NOT ready to share. Do not disclose it. Show discomfort — change the subject, give a vague answer, go quiet, or deflect.
        {% endif %}
        </signal>
    trust_update: |
        Assess how a therapy client's trust changed after the latest exchange.

        ## Trust scale
        1.0=active refusal, 2.0=hesitant, 2.5=session start, 3.0=building trust, 4.0=fully open.

        ## Client context
        - Attachment style: {{ attachment_style }}
        {% if attachment_style == "anxious" %}- Trust is easily lost on perceived rejection. Builds with consistent warmth but gains are fragile.
        {% elif attachment_style == "avoidant" %}- Trust moves slowly. Pushing for disclosure decreases trust. Respecting distance builds it gradually.
        {% elif attachment_style == "disorganized" %}- Trust is volatile. May decrease after sharing something vulnerable, even if the therapist responds well.
        {% elif attachment_style == "secure" %}- Trust moves in a balanced way. Missteps can be repaired.
        {% endif %}
        - What the client expects from the therapist: {{ therapist_ro }}
        - Current trust: {{ current_trust }}/4.0

        ## Latest exchange
        {{ conv_history }}

        Your task is to determine how the therapist's latest message affected trust.

        ## Guidelines
        The default outcome is "unchanged". Only select "increased" or "decreased" when something notable happens.

        ## What INCREASES trust
        - The therapist respected a redirect or resistance instead of pushing through
        - The therapist named something accurate that the client had not said explicitly
        - The therapist sat with discomfort or silence rather than rushing to fill it
        - The therapist adjusted their approach after sensing the client pulling back

        ## What keeps trust UNCHANGED:
        - A standard empathic reflection ("it sounds like...")
        - A reasonable follow-up question
        - Validating what the client just said
        - The conversation proceeding normally

        ## What DECREASES trust
        - Pushing for disclosure the client is not ready for
        - Using a technique or reframe before the client invited it
        - Missing or talking past resistance
        - Formulaic or generic responses that feel scripted
